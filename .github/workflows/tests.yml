name: Testy

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Sestaveni
        run: dotnet build ItEvidence.slnx

      - name: Testy
        run: dotnet test ItEvidence.slnx --no-build --logger "console;verbosity=normal"
